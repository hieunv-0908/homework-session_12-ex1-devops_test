name: "Java CI Matrix Test"

on:
  push:
    branches:
      - main

jobs:
  test-matrix:
    name: Test on Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java and cache Gradle dependencies
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
